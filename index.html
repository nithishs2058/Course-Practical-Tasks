
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="An interactive To-Do List application">
    <title>My Tasks | To-Do List</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <main class="todo-container">

        <header class="todo-header">
            <span class="subtitle">YOUR PRODUCTIVITY SPACE</span>
            <h1>My Tasks<span>.</span></h1>
            <p>Plan your day. Complete your goals.</p>
        </header>

        <section class="task-input-section">
            <form id="task-form">
                <label for="task-input">Add a new task</label>

                <div class="input-group">
                    <input
                        type="text"
                        id="task-input"
                        placeholder="What needs to be done?"
                        autocomplete="off"
                        required
                    >

                    <button type="submit" id="add-button">
                        + Add Task
                    </button>
                </div>
            </form>
        </section>

        <section class="task-section">

            <div class="task-heading">
                <h2>Your Tasks</h2>
                <span id="task-count">0 tasks</span>
            </div>

            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">
                    All
                </button>

                <button class="filter-btn" data-filter="active">
                    Active
                </button>

                <button class="filter-btn" data-filter="completed">
                    Completed
                </button>
            </div>

            <ul id="task-list" aria-live="polite"></ul>

            <p id="empty-message">
                No tasks yet. Add your first task!
            </p>

        </section>

        <footer class="todo-footer">
            <p>Small steps. Big achievements.</p>
        </footer>

    </main>

</body>
</html>
