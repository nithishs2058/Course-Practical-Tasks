
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Nithish S through the accessible contact form.">
    <meta name="author" content="Nithish S">
    <title>Contact | Nithish S Portfolio</title>
</head>
<body>

<header role="banner">
    <h1>Contact Me</h1>

    <nav aria-label="Main navigation">
        <a href="home1.html">Home</a>
        <a href="about1.html">About</a>
        <a href="projects1.html">Projects</a>
        <a href="contact1.html" aria-current="page">Contact</a>
    </nav>
</header>

<main id="main-content">
    <section aria-labelledby="contact-heading">
        <h2 id="contact-heading">Get in Touch</h2>

        <form action="#" method="post" aria-label="Contact form">

            <label for="name">Name:</label>
            <input type="text" id="name" name="name"
                   autocomplete="name" required>

            <br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email"
                   autocomplete="email" required>

            <br><br>

            <label for="subject">Subject:</label>
            <input type="text" id="subject" name="subject" required>

            <br><br>

            <label for="message">Message:</label>
            <textarea id="message" name="message"
                      rows="5" required></textarea>

            <br><br>

            <button type="submit">Send Message</button>

        </form>
    </section>
</main>

<footer role="contentinfo">
    <p>&copy; 2026 Nithish S. All Rights Reserved.</p>
</footer>

</body>
</html>
